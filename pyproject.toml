[project]
name = "alber-h3-director-console"
description = "Alber 导演台 — single-node MiniMax H3 timeline director with built-in model/LoRA/CLIP/VAE loading and one-click Pika ref2va/fl2va LoRA switching."
version = "1.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/AIMixer/ComfyUI_MiniMaxH3_Director"
Documentation = "https://github.com/AIMixer/ComfyUI_MiniMaxH3_Director#readme"
"Bug Tracker" = "https://github.com/AIMixer/ComfyUI_MiniMaxH3_Director/issues"

[tool.comfy]
PublisherId = "alber"
DisplayName = "Alber 导演台 (H3 Director Console)"
Icon = ""
requires-comfyui = ">=0.30.0"
